[package]
name = "fish_openai_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.11.1"
dotenvy = "0.15.7"
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.3", features = ["stream", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
