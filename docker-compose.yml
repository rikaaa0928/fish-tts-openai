
services:
  fish-openai-proxy:
    build: .
    container_name: fish_openai_proxy
    ports:
      - "8000:8000"
    environment:
      # Configure your Fish TTS environment variables here
      - FISH_TTS_URL=http://192.168.0.69:8080/v1/tts
      - FISH_TTS_KEY=key
      - PORT=8000
    restart: unless-stopped